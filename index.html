<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ylixa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f12;
      color: white;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #29292f;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 16px;
      max-width: 85%;
      line-height: 1.5;
    }

    .ylixa {
      background: #202027;
      margin-right: auto;
    }

    .user {
      background: #34343d;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #29292f;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      background: #202027;
      color: white;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: white;
      color: black;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>✦ YLIXA</header>

  <div class="chat" id="chat">
    <div class="message ylixa">
      Hi! I'm Ylixa 👋<br>
      How can I help you?
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      placeholder="Ask Ylixa..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >
    <button onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  chat.innerHTML += `
    <div class="message user">
      ${text}
    </div>
  `;

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const loading = document.createElement("div");
  loading.className = "message ylixa";
  loading.textContent = "Thinking... 🧠";
  chat.appendChild(loading);

  try {
    const response = await fetch(
      "https://ylixa.ylixa.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      }
    );

    const data = await response.json();

    loading.textContent =
      data.reply || data.error || "I couldn't get a response.";

  } catch (error) {
    loading.textContent =
      "I could not connect to YLIXA.";
    console.error(error);
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
